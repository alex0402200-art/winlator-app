name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setujui lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Siapkan kunci tanda tangan
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t')
          echo "Panjang secret setelah dibersihkan: ${#CLEAN} (seharusnya 3512)"
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Beri izin gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: winlator-debug-apk
          path: app/build/outputs/apk/**/*.apk
